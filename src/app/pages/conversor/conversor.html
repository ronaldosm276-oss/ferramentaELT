<section class="conversor" aria-labelledby="titulo-conversor">
  <h2 id="titulo-conversor">Conversor de Grandezas — Potência para Corrente</h2>

  <label for="potencia">Potência ativa (kW)</label>
  <input
    id="potencia"
    type="number"
    step="0.01"
    [value]="potenciaKw()"
    (input)="potenciaKw.set(toNumberOrNull($any($event.target).value))"
  />

  <label for="tensao">Tensão (V)</label>
  <input
    id="tensao"
    type="number"
    step="1"
    [value]="tensao()"
    (input)="tensao.set(toNumberOrNull($any($event.target).value))"
  />

  <label for="fp">Fator de potência</label>
  <input
    id="fp"
    type="number"
    step="0.01"
    min="0"
    max="1"
    [value]="fatorPotencia()"
    (input)="fatorPotencia.set(toNumberOrNull($any($event.target).value))"
  />

  <label for="tipo">Tipo de sistema</label>
  <select id="tipo" [value]="tipoSistema()" (change)="tipoSistema.set($any($event.target).value)">
    <option value="monofasico">Monofásico</option>
    <option value="trifasico">Trifásico</option>
  </select>

  @if (resultado(); as r) {
    @if (r.erro) {
      <p role="alert" class="erro">{{ r.erro }}</p>
    } @else {
      <p>Corrente: {{ r.valor | number: '1.2-2' }} A</p>
    }
  }
</section>
